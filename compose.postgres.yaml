services:
  octopulse:
    environment:
      OCTOPULSE_DB_DRIVER: postgres
      OCTOPULSE_DB_DSN: postgres://octopulse:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/octopulse?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: octopulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: octopulse
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U octopulse -d octopulse"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
