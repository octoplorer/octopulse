version: "2"
sql:
  - engine: sqlite
    schema: db/sqlite/migrations
    queries: db/sqlite/queries
    gen:
      go:
        package: sqlitequery
        out: internal/store/sqlitequery
        sql_package: database/sql
        emit_json_tags: true
        emit_empty_slices: true
  - engine: postgresql
    schema: db/postgres/migrations
    queries: db/postgres/queries
    gen:
      go:
        package: postgresquery
        out: internal/store/postgresquery
        sql_package: database/sql
        emit_json_tags: true
        emit_empty_slices: true
